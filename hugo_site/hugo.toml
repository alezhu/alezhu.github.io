baseURL = 'https://alezhu.github.io/'
defaultContentLanguage = 'ru'
title = 'Блог alezhu'
theme = 'PaperMod'

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true

[minify]
disableJS = true

[params]
env = "production"
description = "Личный блог alezhu"
author = "alezhu"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowToc = false
defaultTheme = "auto"
disableSpecial1stPost = true
comments = true
mainSections = ["авто-мото", "жиза", "программирование", "электроника", "hardware", "software"]

[params.giscus]
repo = "alezhu/alezhu.github.io"
repoId = "R_kgDOVufVnQ"
category = "General"
categoryId = "DIC_kwDOVufVnc4DLIqK"

[menu]
  [[menu.main]]
  identifier = "prog"
  name = "Программирование"
  url = "/программирование/"
  weight = 10

  [[menu.main]]
  identifier = "hw"
  name = "Hardware"
  url = "/hardware/"
  weight = 20

  [[menu.main]]
  identifier = "sw"
  name = "Software"
  url = "/software/"
  weight = 30

  [[menu.main]]
  identifier = "elem"
  name = "Электроника"
  url = "/электроника/"
  weight = 40

  [[menu.main]]
  identifier = "auto"
  name = "Авто-мото"
  url = "/авто-мото/"
  weight = 50

  [[menu.main]]
  identifier = "life"
  name = "Жиза"
  url = "/жиза/"
  weight = 60

  [[menu.main]]
  identifier = "archives"
  name = "Архив"
  url = "/archives/"
  weight = 70

  [[menu.main]]
  identifier = "search"
  name = "Поиск"
  url = "/search/"
  weight = 80

# Mount existing folders directly under content without intermediate /posts/
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../images"
target = "static/images"

[[module.mounts]]
source = "../Авто-мото"
target = "content/авто-мото"

[[module.mounts]]
source = "../Жиза"
target = "content/жиза"

[[module.mounts]]
source = "../Программирование"
target = "content/программирование"

[[module.mounts]]
source = "../Электроника"
target = "content/электроника"

[[module.mounts]]
source = "../Hardware"
target = "content/hardware"

[[module.mounts]]
source = "../Software"
target = "content/software"
